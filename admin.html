<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saanvika Sarees — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ivory:#F4EFE3; --ink:#2A2520; --brass:#A9832E; --line:#DDD0B4; --card:#FBF8F1;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--ivory); color:var(--ink);
    margin:0; padding:24px; max-width:900px; margin:0 auto;
  }
  h1{font-size:22px; margin-bottom:4px;}
  h2{font-size:17px; margin:28px 0 12px;}
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:20px; margin-bottom:20px;
  }
  label{display:block; font-size:13px; font-weight:600; margin:14px 0 5px;}
  input, select, textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:6px; font-size:15px; background:#fff; color:var(--ink);
  }
  textarea{min-height:70px; resize:vertical;}
  button{
    font-size:14px; font-weight:600; padding:11px 20px;
    border-radius:6px; border:1px solid var(--ink); cursor:pointer;
    background:var(--ink); color:var(--ivory); margin-top:16px;
  }
  button.secondary{background:transparent; color:var(--ink);}
  button.danger{background:#8B2E2E; border-color:#8B2E2E; color:#fff;}
  #loginMessage{color:#8B2E2E; font-size:14px; margin-top:8px;}
  .product-row{
    display:flex; gap:14px; align-items:center;
    padding:14px 0; border-bottom:1px solid var(--line);
  }
  .product-row img{
    width:70px; height:85px; object-fit:cover; border-radius:6px;
    background:#eee; flex-shrink:0;
  }
  .product-info{flex:1;}
  .product-info h3{margin:0 0 4px; font-size:16px;}
  .product-info p{margin:0; font-size:13px; color:#6b6355;}
  .badge{
    display:inline-block; font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:10px; margin-top:4px;
    background:#B5651D; color:#fff;
  }
  .badge.sold-out{background:var(--ink);}
  .badge.coming-soon{background:#6B6355;}
  .row-actions{display:flex; gap:8px; flex-shrink:0;}
  .row-actions button{margin-top:0; padding:8px 14px; font-size:13px;}
  #formPanel{display:none;}
  .top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .status-msg{font-size:13px; margin-top:10px;}
  .status-msg.ok{color:#2E7D32;}
  .status-msg.err{color:#8B2E2E;}
</style>
</head>
<body>

<div id="login">
  <h1>Saanvika Sarees — Admin</h1>
  <div class="card">
    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com">
    <label>Password</label>
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="loginMessage"></p>
  </div>
</div>

<div id="dashboard" style="display:none;">
  <div class="top-bar">
    <h1>Saanvika Sarees — Admin</h1>
    <button class="secondary" onclick="logout()">Logout</button>
  </div>

  <button onclick="openAddForm()">+ Add New Saree</button>

  <div class="card" id="formPanel">
    <h2 id="formTitle">Add Saree</h2>
    <input type="hidden" id="editId">

    <label>Photo</label>
    <input type="file" id="photoFile" accept="image/*">
    <img id="photoPreview" src="" alt="" style="display:none; margin-top:10px; width:120px; border-radius:6px;">

    <label>Name</label>
    <input id="fName" placeholder="e.g. Royal Blue & Emerald Silk Cotton">

    <label>Price (RM)</label>
    <input id="fPrice" type="number" placeholder="69">

    <label>Collection / Category</label>
    <select id="fCollection">
      <option value="silk cotton">Silk Cotton</option>
      <option value="kalyani cotton">Kalyani Cotton</option>
      <option value="kanchi cotton">Kanchi Cotton</option>
      <option value="soft silk">Soft Silk</option>
    </select>

    <label>Status</label>
    <select id="fStatus">
      <option value="">No badge (normal listing)</option>
      <option value="selling-fast">Selling Fast</option>
      <option value="sold-out">Sold Out</option>
      <option value="coming-soon">Coming Soon</option>
    </select>

    <label>Description (optional)</label>
    <textarea id="fDescription" placeholder="Any extra detail about the fabric or weave"></textarea>

    <label style="display:flex; align-items:center; gap:8px; margin-top:14px;">
      <input type="checkbox" id="fActive" checked style="width:auto;">
      Show this saree on the website
    </label>

    <div style="display:flex; gap:10px;">
      <button onclick="saveProduct()">Save</button>
      <button class="secondary" onclick="closeForm()">Cancel</button>
    </div>
    <p id="formStatus" class="status-msg"></p>
  </div>

  <h2>Your Sarees</h2>
  <div class="card" id="products"></div>
</div>

<script>
const SUPABASE_URL = "https://lptojkpcugrosayyenua.supabase.co";
const SUPABASE_KEY = "sb_publishable_IEiBy-YGHc3jwPIlZqq3Lg_KwhiXYt9";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- LOGIN ----------
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    document.getElementById("loginMessage").innerText = error.message;
    return;
  }
  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadProducts();
}

async function logout(){
  await supabaseClient.auth.signOut();
  location.reload();
}

// Stay logged in on refresh
supabaseClient.auth.getSession().then(({ data }) => {
  if(data.session){
    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    loadProducts();
  }
});

// ---------- PHOTO PREVIEW ----------
document.getElementById("photoFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  const preview = document.getElementById("photoPreview");
  if(file){
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
});

// ---------- LOAD PRODUCTS ----------
async function loadProducts(){
  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("id", { ascending: false });

  const container = document.getElementById("products");
  if(error){
    container.innerHTML = `<p class="status-msg err">${error.message}</p>`;
    return;
  }
  if(!data.length){
    container.innerHTML = `<p style="color:#6b6355;">No sarees added yet. Click "+ Add New Saree" above.</p>`;
    return;
  }
  container.innerHTML = "";
  data.forEach(p => {
    const row = document.createElement("div");
    row.className = "product-row";
    const badge = p.status ? `<span class="badge ${p.status}">${p.status.replace('-', ' ')}</span>` : '';
    row.innerHTML = `
      <img src="${p.image_url || ''}" alt="${p.name}">
      <div class="product-info">
        <h3>${p.name}</h3>
        <p>RM${p.price || '—'} · ${p.collection || ''} ${p.active ? '' : '· (hidden)'}</p>
        ${badge}
      </div>
      <div class="row-actions">
        <button class="secondary" onclick="openEditForm(${p.id})">Edit</button>
        <button class="danger" onclick="deleteProduct(${p.id})">Delete</button>
      </div>
    `;
    container.appendChild(row);
  });
  window._products = data; // cache for editing
}

// ---------- FORM OPEN/CLOSE ----------
function openAddForm(){
  document.getElementById("formTitle").innerText = "Add Saree";
  document.getElementById("editId").value = "";
  document.getElementById("photoFile").value = "";
  document.getElementById("photoPreview").style.display = "none";
  document.getElementById("fName").value = "";
  document.getElementById("fPrice").value = "";
  document.getElementById("fCollection").value = "silk cotton";
  document.getElementById("fStatus").value = "";
  document.getElementById("fDescription").value = "";
  document.getElementById("fActive").checked = true;
  document.getElementById("formStatus").innerText = "";
  document.getElementById("formPanel").style.display = "block";
  document.getElementById("formPanel").scrollIntoView({ behavior: "smooth" });
}

function openEditForm(id){
  const p = (window._products || []).find(x => x.id === id);
  if(!p) return;
  document.getElementById("formTitle").innerText = "Edit Saree";
  document.getElementById("editId").value = p.id;
  document.getElementById("photoFile").value = "";
  document.getElementById("photoPreview").src = p.image_url || "";
  document.getElementById("photoPreview").style.display = p.image_url ? "block" : "none";
  document.getElementById("fName").value = p.name || "";
  document.getElementById("fPrice").value = p.price || "";
  document.getElementById("fCollection").value = p.collection || "silk cotton";
  document.getElementById("fStatus").value = p.status || "";
  document.getElementById("fDescription").value = p.description || "";
  document.getElementById("fActive").checked = p.active !== false;
  document.getElementById("formStatus").innerText = "";
  document.getElementById("formPanel").style.display = "block";
  document.getElementById("formPanel").scrollIntoView({ behavior: "smooth" });
}

function closeForm(){
  document.getElementById("formPanel").style.display = "none";
}

// ---------- SAVE (ADD or EDIT) ----------
async function saveProduct(){
  const statusEl = document.getElementById("formStatus");
  statusEl.className = "status-msg";
  statusEl.innerText = "Saving...";

  const id = document.getElementById("editId").value;
  const name = document.getElementById("fName").value.trim();
  const price = document.getElementById("fPrice").value;
  const collection = document.getElementById("fCollection").value;
  const status = document.getElementById("fStatus").value || null;
  const description = document.getElementById("fDescription").value.trim();
  const active = document.getElementById("fActive").checked;
  const file = document.getElementById("photoFile").files[0];

  if(!name){
    statusEl.className = "status-msg err";
    statusEl.innerText = "Please enter a name.";
    return;
  }

  let image_url = document.getElementById("photoPreview").src || null;

  // Upload new photo if one was chosen
  if(file){
    const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
    const { error: uploadError } = await supabaseClient
      .storage.from("product-images")
      .upload(fileName, file);
    if(uploadError){
      statusEl.className = "status-msg err";
      statusEl.innerText = "Photo upload failed: " + uploadError.message;
      return;
    }
    const { data: urlData } = supabaseClient
      .storage.from("product-images")
      .getPublicUrl(fileName);
    image_url = urlData.publicUrl;
  }

  const payload = { name, price, collection, status, description, active, image_url };

  let error;
  if(id){
    ({ error } = await supabaseClient.from("products").update(payload).eq("id", id));
  } else {
    ({ error } = await supabaseClient.from("products").insert(payload));
  }

  if(error){
    statusEl.className = "status-msg err";
    statusEl.innerText = error.message;
    return;
  }

  statusEl.className = "status-msg ok";
  statusEl.innerText = "Saved!";
  loadProducts();
  setTimeout(closeForm, 600);
}

// ---------- DELETE ----------
async function deleteProduct(id){
  if(!confirm("Delete this saree? This can't be undone.")) return;
  const { error } = await supabaseClient.from("products").delete().eq("id", id);
  if(error){ alert(error.message); return; }
  loadProducts();
}
</script>
</body>
</html>
